[build]
builder = "RAILPACK"
buildCommand = "npm run build"
watchPatterns = [
  "/apps/web/**",
  "/prompts/**",
  "/package.json",
  "/package-lock.json"
]

[deploy]
startCommand = "npm --workspace @ai-story-copilot/web run preview -- --host 0.0.0.0 --port $PORT"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
